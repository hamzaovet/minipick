name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK & Prepare Asset
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/minipick.apk
          mkdir -p public/downloads
          cp dist-apk/minipick.apk public/downloads/minipick.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minipick-apk
          path: dist-apk/minipick.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0"
          name: "ميني بيك — تطبيق الأندرويد الرسمي"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🌸 تطبيق ميني بيك (Mini Pick) الرسمي للأندرويد
            
            أهلاً بكم في تطبيق **ميني بيك (Mini Pick) — بوتيك الألعاب التركيبية والهدايا الترند** الرسمي للأندرويد!
            
            ### 🔥 مميزات التطبيق:
            - تصفح كتالوج مكعبات النانو، أطقم البيدازلنج، منظمات المكتب والميك أب الكيوت.
            - معاينة تفاصيل ومحتويات كل بوكس، عدد القطع، وصعوبة التركيب.
            - طلب فوري وسريع بلمسة واحدة والدفع عند الاستلام مع ميزة المعاينة قبل الدفع.
            - شحن سريع لطنطا وكافة محافظات مصر.
            
            ### 📥 طريقة التثبيت:
            1. اضغط على رابط التحميل بالأسفل `minipick.apk`.
            2. افتح الملف واضغط **تثبيت (Install)**.
            3. التطبيق مستقل ومخصص لمتجر ميني بيك (`com.minipick.app`).
          files: dist-apk/minipick.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push APK to Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/downloads/minipick.apk
          git commit -m "chore(apk): update official minipick.apk build [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
