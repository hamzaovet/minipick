<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1200px;
      margin: 0;
      padding: 30px;
      background: #09050d;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      position: relative;
      width: 1140px;
      height: 700px;
      border-radius: 36px;
      background: radial-gradient(circle at 12% 15%, rgba(236, 72, 153, 0.22) 0%, transparent 45%),
                  radial-gradient(circle at 88% 85%, rgba(244, 63, 94, 0.16) 0%, transparent 50%),
                  linear-gradient(145deg, #1d1024 0%, #110916 50%, #070409 100%);
      border: 2.5px solid rgba(244, 114, 182, 0.45);
      box-shadow: 0 0 70px rgba(236, 72, 153, 0.25),
                  0 30px 60px -15px rgba(0, 0, 0, 0.98),
                  inset 0 1px 2px rgba(254, 226, 226, 0.35);
      padding: 38px 46px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    
    .card::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 26px;
      border: 1px solid rgba(244, 114, 182, 0.22);
      pointer-events: none;
    }

    .glow-top {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 320px;
      height: 320px;
      background: rgba(236, 72, 153, 0.18);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .glow-bottom {
      position: absolute;
      bottom: -100px;
      left: -100px;
      width: 320px;
      height: 320px;
      background: rgba(244, 63, 94, 0.15);
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(244, 114, 182, 0.25);
      padding-bottom: 22px;
      position: relative;
      z-index: 2;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo-badge {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, #fce7f3 0%, #ec4899 50%, #be185d 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }
    .logo-letter {
      font-family: 'Cairo', sans-serif;
      font-size: 30px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -1px;
    }
    .brand-text h1 {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #fce7f3 40%, #f472b6 80%, #db2777 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 3px;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 13.5px;
      font-weight: 700;
      color: #f472b6;
      letter-spacing: 0.5px;
    }
    .vip-pill {
      padding: 8px 22px;
      border-radius: 9999px;
      background: rgba(236, 72, 153, 0.12);
      border: 1.5px solid rgba(244, 114, 182, 0.45);
      color: #fce7f3;
      font-family: 'Quicksand', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.22);
    }

    /* Dual QR Section */
    .qr-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin: 18px 0;
      position: relative;
      z-index: 2;
    }
    .qr-box {
      background: rgba(18, 11, 23, 0.75);
      border: 1.5px solid rgba(244, 114, 182, 0.28);
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }
    .qr-white-card {
      background: #ffffff;
      padding: 10px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      display: inline-block;
      margin-bottom: 14px;
      border: 3px solid #fbcfe8;
    }
    .qr-white-card img {
      width: 155px;
      height: 155px;
      display: block;
      image-rendering: pixelated;
    }
    .qr-badge-pink {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #f472b6;
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .qr-badge-emerald {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: #34d399;
      font-size: 15.5px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .qr-link {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      color: #d4d4d8;
      direction: ltr;
      display: block;
      font-weight: 600;
    }

    /* Bottom Contacts Bar */
    .bottom-bar {
      display: grid;
      grid-template-columns: 1.15fr 0.9fr 1.35fr;
      align-items: center;
      border-top: 1px solid rgba(244, 114, 182, 0.25);
      padding-top: 20px;
      position: relative;
      z-index: 2;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-circle {
      width: 40px;
      height: 40px;
      border-radius: 14px;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(244, 114, 182, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f472b6;
      flex-shrink: 0;
    }
    .phone-text strong {
      font-size: 16px;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: block;
      line-height: 1.2;
    }
    .phone-text span {
      font-size: 12px;
      color: #fbcfe8;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
    }
    .social-text {
      font-size: 14px;
      color: #ffffff;
      font-weight: 800;
      direction: ltr;
      text-align: right;
    }
    .loc-text strong {
      font-size: 13.5px;
      color: #ffffff;
      font-weight: 800;
      display: block;
      line-height: 1.3;
    }
    .loc-text span {
      font-size: 11px;
      color: #34d399;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }
  </style>
</head>
